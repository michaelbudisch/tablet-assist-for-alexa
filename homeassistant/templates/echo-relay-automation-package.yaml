# Optional package; JSON syntax is valid YAML. Do not duplicate existing helpers/scripts.
# Set your weather entity and enable greeting only after testing.
{
  "input_text": {
    "jarvis_name_frau": {
      "name": "Jarvis Name Frau",
      "max": 40
    },
    "jarvis_name_mann": {
      "name": "Jarvis Name Mann",
      "max": 40
    },
    "jarvis_name_kind": {
      "name": "Jarvis Name Kind",
      "max": 40
    },
    "jarvis_sprechstatus": {
      "name": "Jarvis Sprechstatus",
      "max": 100
    },
    "jarvis_sprachbridge_status": {
      "name": "Jarvis Sprachbridge Status",
      "max": 100
    }
  },
  "input_datetime": {
    "jarvis_letzte_begrussung": {
      "name": "Jarvis Letzte Begrüßung",
      "has_date": true,
      "has_time": true
    }
  },
  "timer": {
    "jarvis_begrussung_testfenster": {
      "name": "Jarvis Begrüßung Testfenster",
      "duration": "00:05:00",
      "restore": false
    }
  },
  "script": {
    "jarvis_sprechen": {
      "alias": "Jarvis · Sprechen",
      "description": "Text an das sichtbare Echo-Relay-Tablet senden. Nur bei freier Wiedergabe, ohne parallele Sprachaufträge. Optionale Anschlussfrage; Tagesüberblick kann gezielt angeboten werden. Ergebnis wird über Sprechstatus bestätigt.",
      "icon": "mdi:account-voice",
      "mode": "single",
      "max_exceeded": "silent",
      "fields": {
        "message": {
          "name": "Text",
          "required": true,
          "selector": {
            "text": {
              "multiline": true
            }
          }
        },
        "followup": {
          "name": "Anschlussfrage zulassen",
          "default": false,
          "selector": {
            "boolean": {}
          }
        },
        "daily_overview": {
          "name": "Ja als Tagesüberblick interpretieren",
          "default": false,
          "selector": {
            "boolean": {}
          }
        }
      },
      "sequence": [
        {
          "variables": {
            "request_id": "{{ (as_timestamp(now()) * 1000000) | int | string }}",
            "speech_text": "{{ message | default('') | string | trim | truncate(800, true, '…', 0) }}"
          }
        },
        {
          "variables": {
            "bridge_state": "{% set p = states('input_text.jarvis_sprachbridge_status').split('|') %}{{ p[0] if p | length == 3 and p[2] == '1.4.0' and 0 <= as_timestamp(now()) * 1000 - (p[1] | float(0)) < 40000 else 'offline' }}"
          }
        },
        {
          "if": [
            {
              "condition": "template",
              "value_template": "{{ bridge_state != 'ready' }}"
            }
          ],
          "then": [
            {
              "variables": {
                "speech_result": {
                  "started": false,
                  "status": "{{ 'tablet_busy' if bridge_state == 'busy' else 'tablet_offline' }}"
                }
              }
            },
            {
              "stop": "Sprachbridge nicht bereit",
              "response_variable": "speech_result"
            }
          ]
        },
        {
          "condition": "template",
          "value_template": "{{ speech_text | length > 0 }}"
        },
        {
          "action": "input_text.set_value",
          "target": {
            "entity_id": "input_text.jarvis_sprechstatus"
          },
          "data": {
            "value": "{{ request_id ~ '|pending' }}"
          }
        },
        {
          "event": "jarvis_speech_request",
          "event_data": {
            "request_id": "{{ request_id }}",
            "message": "{{ speech_text }}",
            "followup": "{{ followup | default(false) | bool }}",
            "daily_overview": "{{ daily_overview | default(false) | bool }}"
          }
        },
        {
          "wait_template": "{{ states('input_text.jarvis_sprechstatus') in [request_id ~ '|started', request_id ~ '|skipped', request_id ~ '|error'] }}",
          "timeout": "00:00:30",
          "continue_on_timeout": true
        },
        {
          "if": [
            {
              "condition": "template",
              "value_template": "{{ not wait.completed and is_state('input_text.jarvis_sprechstatus', request_id ~ '|pending') }}"
            }
          ],
          "then": [
            {
              "action": "input_text.set_value",
              "target": {
                "entity_id": "input_text.jarvis_sprechstatus"
              },
              "data": {
                "value": "{{ request_id ~ '|timeout' }}"
              }
            }
          ]
        },
        {
          "variables": {
            "speech_result": {
              "started": "{{ wait.completed and is_state('input_text.jarvis_sprechstatus',request_id ~ '|started') }}",
              "status": "{{ states('input_text.jarvis_sprechstatus').split('|')[-1] if wait.completed else 'timeout' }}"
            }
          }
        },
        {
          "stop": "Sprachausgabe angefordert",
          "response_variable": "speech_result"
        }
      ]
    }
  },
  "automation": [
    {
      "alias": "Jarvis · Morgendliche Begrüßung",
      "description": "Optional local morning greeting. Configure weather entity and opt-in motion detection. Category estimates are not identity recognition. Test timer bypasses the time window without marking the day.",
      "triggers": [
        {
          "trigger": "event",
          "event_type": "jarvis_echo_relay_detection"
        }
      ],
      "conditions": [
        {
          "condition": "or",
          "conditions": [
            {
              "condition": "time",
              "after": "06:00:00",
              "before": "10:00:00"
            },
            {
              "condition": "state",
              "entity_id": "timer.jarvis_begrussung_testfenster",
              "state": "active"
            }
          ]
        },
        {
          "condition": "template",
          "value_template": "{{ trigger.event.data.labels is defined and 'person' in trigger.event.data.labels and (is_state('timer.jarvis_begrussung_testfenster','active') or states('input_datetime.jarvis_letzte_begrussung')[:10] != now().strftime('%Y-%m-%d')) }}"
        }
      ],
      "actions": [
        {
          "variables": {
            "forecast_data": {},
            "speech_result": {},
            "name_woman": "{{ states('input_text.jarvis_name_frau') if has_value('input_text.jarvis_name_frau') else '' }}",
            "name_man": "{{ states('input_text.jarvis_name_mann') if has_value('input_text.jarvis_name_mann') else '' }}",
            "name_child": "{{ states('input_text.jarvis_name_kind') if has_value('input_text.jarvis_name_kind') else '' }}",
            "test_run": "{{ is_state('timer.jarvis_begrussung_testfenster','active') }}"
          },
          "alias": "Familiennamen aus HA-Helfern laden"
        },
        {
          "action": "weather.get_forecasts",
          "target": {
            "entity_id": "weather.home"
          },
          "data": {
            "type": "hourly"
          },
          "response_variable": "forecast_data",
          "continue_on_error": true
        },
        {
          "variables": {
            "rain": "{% set ns=namespace(rain=false) %}{% for f in (forecast_data | default({})).get('weather.home',{}).get('forecast',[]) %}{% set ts=as_timestamp(f.get('datetime'),0) %}{% if as_timestamp(now())-3600 <= ts <= as_timestamp(now())+21600 and (f.get('condition') in ['rainy','pouring','lightning-rainy','snowy-rainy'] or f.get('precipitation_probability',0) | float(0) >= 50) %}{% set ns.rain=true %}{% endif %}{% endfor %}{{ ns.rain }}",
            "greeting_name": "{%- set data = trigger.event.data if trigger is defined and trigger.event is defined else {} -%}\n{%- set detection = data.get('detection', {}) -%}\n{%- set labels = data.get('labels', []) -%}\n{%- if not detection.get('uncertain', true) and detection.get('person_count', 0) == 1 -%}\n  {%- if 'child' in labels -%}{{ name_child | trim }}\n  {%- elif 'woman' in labels and 'man' not in labels -%}{{ name_woman | trim }}\n  {%- elif 'man' in labels and 'woman' not in labels -%}{{ name_man | trim }}\n  {%- endif -%}\n{%- endif -%}",
            "greeting_text": "Guten Morgen{% if greeting_name | trim %}, {{ greeting_name | trim }}{% endif %}!{% if rain %} In den nächsten Stunden könnte es regnen. Denk an einen Regenschirm.{% endif %} Möchtest du deinen Tagesüberblick hören?"
          },
          "alias": "Begrüßung anhand der Kategorien und Wettervorhersage"
        },
        {
          "action": "script.jarvis_sprechen",
          "data": {
            "message": "{{ greeting_text }}",
            "followup": true,
            "daily_overview": true
          },
          "response_variable": "speech_result",
          "continue_on_error": true
        },
        {
          "if": [
            {
              "condition": "template",
              "value_template": "{{ (speech_result | default({})).get('started',false) }}"
            }
          ],
          "then": [
            {
              "if": [
                {
                  "condition": "template",
                  "value_template": "{{ test_run }}"
                }
              ],
              "then": [
                {
                  "action": "timer.cancel",
                  "target": {
                    "entity_id": "timer.jarvis_begrussung_testfenster"
                  }
                },
                {
                  "action": "logbook.log",
                  "data": {
                    "name": "Jarvis Begrüßung",
                    "entity_id": "input_datetime.jarvis_letzte_begrussung",
                    "message": "Test der HA-Begrüßung: Wiedergabestart bestätigt."
                  }
                }
              ],
              "else": [
                {
                  "action": "input_datetime.set_datetime",
                  "target": {
                    "entity_id": "input_datetime.jarvis_letzte_begrussung"
                  },
                  "data": {
                    "timestamp": "{{ as_timestamp(now()) }}"
                  }
                },
                {
                  "action": "logbook.log",
                  "data": {
                    "name": "Jarvis Begrüßung",
                    "entity_id": "input_datetime.jarvis_letzte_begrussung",
                    "message": "Wiedergabestart der HA-Begrüßung bestätigt."
                  }
                }
              ]
            }
          ]
        },
        {
          "delay": {
            "seconds": 60
          }
        }
      ],
      "mode": "single",
      "max_exceeded": "silent",
      "trace": {
        "stored_traces": 15
      },
      "initial_state": false
    }
  ]
}
