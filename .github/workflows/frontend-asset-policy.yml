name: TAFA frontend asset policy

on:
  push:
    paths:
      - ".github/workflows/frontend-asset-policy.yml"
      - "scripts/tafa_frontend_cleanup.py"
      - "tests/test_tafa_frontend_assets.py"
      - "custom_components/tablet_assist_for_alexa/frontend/**"
      - "tafa_app/bundle/tablet_assist_for_alexa/frontend/**"
  pull_request:
    paths:
      - ".github/workflows/frontend-asset-policy.yml"
      - "scripts/tafa_frontend_cleanup.py"
      - "tests/test_tafa_frontend_assets.py"
      - "custom_components/tablet_assist_for_alexa/frontend/**"
      - "tafa_app/bundle/tablet_assist_for_alexa/frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-assets:
    name: Stable frontend names and safe cleanup tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public frontend mirrors and stable filenames
        run: python scripts/tafa_frontend_cleanup.py --repo-check
      - name: Verify safe private frontend pruning and archive recovery
        run: python -m unittest discover -s tests -p "test_tafa_frontend_assets.py" -v
