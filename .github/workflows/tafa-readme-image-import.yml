name: Temporary TAFA README banner import
on:
  push:
    paths:
      - .github/workflows/tafa-readme-image-import.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch full quality TAFA banner and update README only
        env:
          IMAGE_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2Fa157d70f-1374-4ff6-99a6-3ceb37c3f591/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAALLzeV-F84MPoKKKbD_amPxcdRcOr8nibtjO7FAaRo38&exp=1795738813&osig=AAAAAAAAAAAAAAAAAAAAAFWyNL7kdegd8-BkJ5nS2Qc18ZLgnXwUYgrWf03c6qXD&signer=media-rpc&token=AAIAAU0AJGExNTdkNzBmLTEzNzQtNGZmNi05OWE2LTNjZWIzN2MzZjU5MQAAAAABohpfwkhiEoVSn2HNuXBG534mHvxEhagx5RNlsZ4xA71HlWK8gg&x-canva-quality=thumbnail'
        run: |
          python - <<'PY'
          import os,urllib.request
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          src=os.environ["IMAGE_URL"]
          options=[
              src.replace('/height:112/','/height:941/').replace('/width:200?','/width:1672?'),
              src.replace('/height:112/','/height:675/').replace('/width:200?','/width:1200?'),
              src
          ]
          best=None
          for attempt,url in enumerate(options):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'TAFA-README-image-import'})
                  with urllib.request.urlopen(req,timeout=20) as resp: data=resp.read()
                  im=Image.open(BytesIO(data))
                  print(f"Attempt {attempt}: size={im.size}, bytes={len(data)}")
                  if im.width>=1000 and im.height>=560:
                      best=data
                      break
              except Exception as exc:
                  print(f"Attempt {attempt}: {type(exc).__name__}: {str(exc)[:120]}")
          if not best:
              raise SystemExit("No full-resolution Canva image was made available; README unchanged.")
          dest=Path("docs/assets/tafa-readme-banner.png")
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(best)
          path=Path("README.md")
          current=path.read_text(encoding="utf-8")
          if "docs/assets/tafa-readme-banner.png" not in current:
              if "<h1 align=\"center\">TAFA — Tablet Assist for Alexa</h1>" not in current:
                  raise SystemExit("README header unexpectedly changed; abort.")
              marker='<p align="center"><strong>English</strong> · <a href="README.de.md">Deutsch</a></p>\n'
              if marker not in current:
                  raise SystemExit("Cannot locate safe banner insertion point")
              current=current.replace(marker,marker+'\n![TAFA — your local AI assistant for Home Assistant](docs/assets/tafa-readme-banner.png)\n',1)
              path.write_text(current,encoding="utf-8")
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md docs/assets/tafa-readme-banner.png
          git rm .github/workflows/tafa-readme-image-import.yml
          git commit -m "docs: display original-logo TAFA hero in README"
          git push origin HEAD:main
