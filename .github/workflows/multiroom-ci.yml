name: Multiroom routing tests
on:
  push:
    paths:
      - 'custom_components/tablet_assist_for_alexa/relay/**'
      - 'tafa_app/tests/test_room*.py'
      - 'tafa_app/tests/test_device_center.py'
      - '.github/workflows/multiroom-ci.yml'
  pull_request:
    paths:
      - 'custom_components/tablet_assist_for_alexa/relay/**'
      - 'tafa_app/tests/test_room*.py'
      - 'tafa_app/tests/test_device_center.py'
      - '.github/workflows/multiroom-ci.yml'
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate TAFA multiroom Python modules
        run: python -m compileall -q custom_components/tablet_assist_for_alexa/relay
      - name: Run TAFA room audio and routing tests
        run: python -m unittest discover -s tafa_app/tests -p 'test_room*.py' -v
