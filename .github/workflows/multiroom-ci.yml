name: Experimental multiroom routing tests
on:
  push:
    paths: ['homeassistant/custom_components/jarvis_tablet_audio/relay_room_router.py', 'homeassistant/tests/test_room_router.py', '.github/workflows/multiroom-ci.yml']
  pull_request:
    paths: ['homeassistant/custom_components/jarvis_tablet_audio/relay_room_router.py', 'homeassistant/tests/test_room_router.py', '.github/workflows/multiroom-ci.yml']
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python homeassistant/tests/test_room_router.py -v
