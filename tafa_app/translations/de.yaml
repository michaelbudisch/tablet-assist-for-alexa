configuration:
  speech_mode:
    name: Sprachserver auswählen
    description: "local = Piper und Whisper in TAFA; external = bestehenden Proxmox-Sprachserver nutzen und lokale Modelle nicht starten."
  external_piper_base:
    name: Proxmox-Sprachserver – Piper-Adresse
    description: "Nur bei external. Interne Adresse zur Piper-Sprachausgabe, z. B. http://192.168.1.50:5000. Wyoming-STT wird in Home Assistant separat eingerichtet (meist Port 10300)."
  gpu_base:
    name: GPU-Hauptrechner – Qwen-Adresse
    description: "Optionaler Windows-GPU-Worker für schnelle Qwen-Stimme, z. B. http://192.168.1.100:10502. Leer lassen, wenn kein GPU-Worker vorhanden ist."
  hardware_profile:
    name: Sprachausgabe bevorzugen
    description: "automatic = Qwen verwenden, wenn bereit, sonst Piper-Fallback; cpu = immer Piper. Verbindungsstatus und Test im TAFA Control Center."
  voice_variant:
    name: Qwen-Stimme
    description: "Standardstimme aus dem GPU-Worker oder gespeicherte Variante 1 bis 9."
  live_profile:
    name: Klangprofil
    description: "natural = Natürlich, studio = Studio, clear = Klar."
  mp3_base:
    name: Proxmox – MP3-Generator für Alexa
    description: "Optionaler interner Generator, z. B. http://192.168.1.50:5001. Nur im privaten LAN; keine Tokens."
  public_audio_base:
    name: Alexa – öffentliche HTTPS-Audioadresse
    description: "Optionaler öffentlicher Nginx-Proxy, z. B. https://audio.example.org; nur kurzlebige MP3-Dateien, niemals die Generierungs-API."
  mp3_profile:
    name: Klangprofil für Alexa-Durchsagen
    description: "natural = Natürlich, studio = Studio, announcement = Durchsage."
  chime:
    name: Signalton vor Durchsagen
    description: "Vor Alexa-MP3-Ansagen einen kurzen Signalton aktivieren."

# Integration settings are owned by this App. No duplicate setup under Devices & services.
  cpu_stt:
    name: Whisper-Entität (CPU)
    description: "Optional. Wyoming-Entitäts-ID, z. B. stt.faster_whisper. Bei genau einer Wyoming-STT-Entität wird sie automatisch ausgewählt."
  gpu_stt:
    name: Whisper-Entität (GPU, optional)
    description: "Optionaler zweiter Wyoming-STT-Dienst auf dem GPU-Rechner; muss von CPU verschieden sein."
  gpu_stt_host:
    name: GPU-Whisper-Host (optional)
    description: "Nur Host oder IP, kein Protokoll und kein Port."
  llm_agent:
    name: KI-Konversationsagent (optional)
    description: "HA-Entitäts-ID der vorhandenen KI, z. B. conversation.ollama."
  conversation_mode:
    name: Gesprächsmodus
    description: "Automatisch, intelligent oder manuell; steuert die KI-Weiterleitung."
  rooms_json:
    name: Alexa-Räume (JSON, optional)
    description: "Optional, z. B. {\"Wohnzimmer\":{\"notify\":\"notify.echo_wohnzimmer\"}}. Nur vorhandene Räume verwenden."
  sources_json:
    name: HA-Datenquellen (JSON, optional)
    description: "Optional, z. B. {\"weather\":\"weather.home\",\"solar\":\"sensor.pv_power\"}. Leeres {} deaktiviert alle."
  learning_enabled:
    name: Optionale Hausdaten-Lernfunktion
    description: "Nur bekannte, freigegebene Hausdaten-Abfragen; standardmäßig aus."
  reminders_enabled:
    name: Gemeinsame Erinnerungen
    description: "Erinnerungsfunktion in TAFA aktivieren."
  reminder_room:
    name: Echo-Raum für Erinnerungen (optional)
    description: "Name muss in Alexa-Räume enthalten sein."
