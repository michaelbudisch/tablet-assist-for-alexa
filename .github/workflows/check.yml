name: Source, audio and staging checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    # Match the pinned Playwright version's supported browser dependencies.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python tests/check_sources.py
      - run: python tests/test_audio.py
      - run: python tests/test_install.py
      - run: python tests/test_marketplace.py
      - run: python tests/test_proxy.py
      - run: python tests/test_proxy_host.py
      - run: python tests/test_standalone.py
      - run: python tests/test_local_intents.py
      - run: node tests/test_camera_preview.mjs
      - run: npm ci --prefix tests/ui --no-audit --no-fund
      - run: npx --prefix tests/ui playwright install --with-deps chromium
      - run: node tests/ui/camera-infobox.mjs
      - run: node tests/ui/model-settings.mjs
      - run: node tests/ui/settings.mjs
