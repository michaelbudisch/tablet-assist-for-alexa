name: Source, audio and staging checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python tests/check_sources.py
      - run: python tests/test_audio.py
      - run: python tests/test_install.py
      - run: python tests/test_marketplace.py
      - run: python tests/test_proxy.py
