name: Publish developer preview v0.3.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.3.1.yml'
permissions:
  contents: read
concurrency:
  group: publish-v0.3.1
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: 6a3de58a79d0450c4610deb05403b37437cd51de
    steps:
      - name: Verify exact tested source
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs?head_sha=$RELEASE_SHA&per_page=100" > checks.json
          jq -e '.workflow_runs | any(.name == "Marketplace validation" and .status == "completed" and .conclusion == "success")' checks.json
          jq -e '.workflow_runs | any(.name == "Source, audio and staging checks" and .status == "completed" and .conclusion == "success")' checks.json
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Check release version and layout
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.3.1"
          test "$(jq -r .version custom_components/tablet_assist_for_alexa/manifest.json)" = "0.3.1"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Publish preview release
        run: |
          set -euo pipefail
          if gh release view v0.3.1 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists; nothing changed."
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v0.3.1" >/dev/null 2>&1; then
            echo "Tag exists without a release; inspect before publishing."
            exit 1
          fi
          cat > /tmp/tablet-assist-notes.md <<'NOTES'
          ## Developer Preview / Entwicklungsvorschau

          **English**
          - Standalone Home Assistant sidebar dashboard and configurable data sources.
          - Local German intent recognition, weather, shopping lists (including Bring!), waste collection, heating and energy data.
          - Persistent confirmed reminder and contextual follow-up questions.
          - Optional admin-approved read-only learning aliases. Disabled by default.
          - German and English documentation and interface.

          **Deutsch**
          - Eigenständige Home-Assistant-Sprachzentrale mit frei konfigurierbaren Datenquellen.
          - Lokale deutsche Absichtserkennung, Wetter, Bring!-Einkaufsliste, Mülltermine, Heizungs- und Energiedaten.
          - Gespeicherte und bestätigte Erinnerung, kontextbezogene Folgefragen.
          - Freiwillige, administrativ freigegebene lesende Lernzuordnungen. Standardmäßig deaktiviert.
          - Oberfläche und Dokumentation auf Deutsch und Englisch.

          Installation: Home Assistant 2026.11+; Settings → Marketplace → Add from link, or HACS custom integration. Select the preview version if the client hides prereleases. Speech servers are installed separately. No legacy installation migration is performed.

          - [English setup guide](https://github.com/michaelbudisch/tablet-assist-for-alexa/blob/v0.3.1/docs/en/marketplace.md)
          - [Deutsche Installationsanleitung](https://github.com/michaelbudisch/tablet-assist-for-alexa/blob/v0.3.1/docs/marketplace.md)

          Automated source, audio, staging, intent and marketplace checks passed for the tagged commit. Fresh hardware installation, physical tablet/Echo playback and real provider integrations still require validation. This is not a production-ready stable release.
          NOTES
          gh release create v0.3.1 --repo "$GH_REPO" --target "$RELEASE_SHA" --title "v0.3.1 — Developer Preview" --prerelease --notes-file /tmp/tablet-assist-notes.md
  smoke:
    name: Fresh HA container import and package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a3de58a79d0450c4610deb05403b37437cd51de
          persist-credentials: false
      - name: Stage standalone installation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ha-test/custom_components"
          cp -a custom_components/tablet_assist_for_alexa "$RUNNER_TEMP/ha-test/custom_components/"
          test "$(find "$RUNNER_TEMP/ha-test/custom_components" -mindepth 1 -maxdepth 1 -type d | wc -l)" = 1
      - name: Import against actual Home Assistant Core
        run: |
          docker run --rm --entrypoint python3 -v "$RUNNER_TEMP/ha-test:/config:ro" ghcr.io/home-assistant/home-assistant:2026.11.0 -c 'import sys, importlib; sys.path.insert(0, "/config"); base="custom_components.tablet_assist_for_alexa"; modules=["", ".config_flow", ".stt", ".tts", ".conversation", ".learning_ws", ".local_data", ".reminders"]; [importlib.import_module(base + m) for m in modules]; print("Standalone integration modules imported successfully in real HA Core")'
