name: TAFA
slug: tafa
version: "0.3.28"
description: Unified voice assistant backend and setup control center
url: https://github.com/michaelbudisch/tablet-assist-for-alexa/tree/main/tafa_app
arch:
  - amd64
  - aarch64
homeassistant: "2026.11.0"
homeassistant_api: true
startup: application
boot: auto
stage: experimental
init: true
ingress: true
ingress_port: 8099
panel_admin: true
panel_title: TAFA
panel_icon: mdi:microphone-message
map:
  - type: homeassistant_config
    read_only: false
# Fresh installations start in setup mode without downloading CPU models.
# Existing local/external Supervisor options remain unchanged on upgrade.
# Explicit local mode enables the built-in CPU Piper/Whisper fallback.
options:
  speech_mode: setup
  external_piper_base: ""
  cpu_stt: ""
  gpu_base: ""
  gpu_stt: ""
  gpu_stt_host: ""
  hardware_profile: automatic
  voice_variant: default
  live_profile: natural
  llm_agent: ""
  conversation_mode: intelligent
  mp3_base: ""
  public_audio_base: ""
  rooms_json: "{}"
  mp3_profile: natural
  chime: false
  sources_json: "{}"
  learning_enabled: false
  reminders_enabled: false
  reminder_room: ""
schema:
  speech_mode: list(setup|local|external)
  external_piper_base: str
  cpu_stt: str
  gpu_base: str
  gpu_stt: str
  gpu_stt_host: str
  hardware_profile: list(automatic|cpu)
  voice_variant: list(default|1|2|3|4|5|6|7|8|9)
  live_profile: list(natural|studio|clear)
  llm_agent: str
  conversation_mode: list(manual|intelligent|automatic)
  mp3_base: str
  public_audio_base: str
  rooms_json: str
  mp3_profile: list(natural|studio|announcement)
  chime: bool
  sources_json: str
  learning_enabled: bool
  reminders_enabled: bool
  reminder_room: str
