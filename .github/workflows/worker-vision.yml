name: Worker vision checks
on:
  push:
    paths: ['worker/vision/**', 'worker/compose.yaml', '.github/workflows/worker-vision.yml']
  pull_request:
    paths: ['worker/vision/**', 'worker/compose.yaml', '.github/workflows/worker-vision.yml']
permissions:
  contents: read
jobs:
  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r worker/vision/requirements.txt
      - run: python -m unittest discover -s worker/vision -v
      - run: docker compose -f worker/compose.yaml --profile llm --profile vision config --quiet
        env:
          LAN_IP: 192.0.2.1
          JARVIS_TTS_TOKEN: test-only-placeholder-not-a-secret
