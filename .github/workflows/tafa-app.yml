name: TAFA App provisioning tests
on:
  push:
    paths:
      - 'tafa_app/**'
      - '.github/workflows/tafa-app.yml'
  pull_request:
    paths:
      - 'tafa_app/**'
      - '.github/workflows/tafa-app.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python and provisioning
        run: |
          python -m compileall -q tafa_app
          python -m unittest discover -s tafa_app/tests -v
