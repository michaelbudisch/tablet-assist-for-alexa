rest_command:
  piper_generate:
    url: "http://__JARVIS_CPU_HOST__:5001/generate"
    method: POST
    headers:
      X-API-Key: !secret piper_api_token
    content_type: "application/json"
    payload: >-
      {% set voice = states('input_select.jarvis_stimme') %}
      {{ {
        "text": text,
        "profile": states('input_select.jarvis_stt_profil'),
        "voice_variant": (voice.split()[-1] if voice.startswith('Variante ') else 'default'),
        "chime": is_state('input_boolean.jarvis_signalton','on'),
        "sound_profile": states('input_select.jarvis_klangprofil')
      } | to_json }}
    timeout: 120
