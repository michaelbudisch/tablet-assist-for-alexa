name: jarvis-gpu-worker
services:
  whisper:
    build:
      context: https://github.com/OHF-Voice/wyoming-faster-whisper.git
      dockerfile: Dockerfile.gpu
    image: jarvis-whisper-gpu:local
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${LAN_IP}:10300:10300"
    volumes:
      - whisper-data:/data
    command: ["--model", "turbo", "--language", "de", "--device", "cuda", "--compute-type", "int8_float16", "--beam-size", "3"]
    restart: unless-stopped
  qwen:
    build: ./qwen
    image: jarvis-qwen-tts:1.0.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${LAN_IP}:10501:10501"
    environment:
      JARVIS_TTS_TOKEN: ${JARVIS_TTS_TOKEN:?run Setup.ps1 first}
      QWEN_MODEL: ${QWEN_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice}
      QWEN_SPEAKER: ${QWEN_SPEAKER:-Ryan}
      HF_HOME: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - qwen-data:/models
    restart: unless-stopped
    profiles: ["tts"]
  qwen-stream:
    build: ./qwen-stream
    image: jarvis-qwen-stream:1.5.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${LAN_IP}:10502:10502"
    environment:
      JARVIS_TTS_TOKEN: ${JARVIS_TTS_TOKEN:?run Setup.ps1 first}
      QWEN_SPEAKER: ${QWEN_SPEAKER:-Ryan}
      STREAM_VOICE_MODE: ${STREAM_VOICE_MODE:-fast}
      STREAM_FIXED_MODEL_SIZE: ${STREAM_FIXED_MODEL_SIZE:-1.7B}
      STREAM_VOICE_VARIANT: ${STREAM_VOICE_VARIANT:-1}
      STREAM_VOICE_STYLE: ${STREAM_VOICE_STYLE:-A mature male voice with a warm low-mid register, calm and precise delivery, clear natural German diction, subtle British-influenced cadence, and a professional, composed tone. Moderate pace, no theatrical exaggeration.}
      HF_HOME: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - qwen-data:/models
    restart: unless-stopped
    profiles: ["stream"]
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "0"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    profiles: ["llm"]
    networks: [llm-private]
  ollama-gateway:
    image: nginx:alpine
    environment:
      JARVIS_TTS_TOKEN: ${JARVIS_TTS_TOKEN:?run Setup.ps1 first}
      NGINX_ENVSUBST_FILTER: "^JARVIS_TTS_TOKEN$"
    ports:
      - "${LAN_IP}:11434:8080"
    volumes:
      - ./ollama/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - ollama
    restart: unless-stopped
    profiles: ["llm"]
    networks: [llm-private]
volumes:
  whisper-data:
  qwen-data:
  ollama-data:
networks:
  llm-private:
