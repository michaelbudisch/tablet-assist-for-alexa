name: Android signed release
on:
  workflow_dispatch:
  push:
    branches: [feat/jarvis-multiroom]
    paths: ['android/**', '.github/workflows/android-release.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Assemble release
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --no-problems-report
      - name: Sign only with existing private release key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'Existing signing credentials are not configured; no installable release produced.'
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key"
          tools="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p release-output
          version="$(tr -d '\r\n' < android/VERSION)"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "release-output/HA-Jarvis-Echo-Relay-$version.apk" android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$tools/apksigner" verify --verbose --print-certs "release-output/HA-Jarvis-Echo-Relay-$version.apk"
          # Compare certificate fingerprints against the last signed APK.
          old="$(find android/downloads -name 'HA-Jarvis-Echo-Relay-0.5.0-preview.apk' -print -quit)"
          test -n "$old"
          old_cert="$("$tools/apksigner" verify --print-certs "$old" | grep 'certificate SHA-256 digest:' | sort)"
          new_cert="$("$tools/apksigner" verify --print-certs "release-output/HA-Jarvis-Echo-Relay-$version.apk" | grep 'certificate SHA-256 digest:' | sort)"
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
          (cd release-output && sha256sum *.apk > SHA256SUMS)
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: HA-Jarvis-Echo-Relay-signed-release
          path: release-output/
          if-no-files-found: error
