plugins { id 'com.android.application' }
android {
    namespace 'de.jarvis.audio'
    compileSdk 35
    defaultConfig { applicationId 'de.jarvis.audio'; minSdk 28; targetSdk 34; versionCode 7; versionName '0.5.0' }
    buildFeatures { buildConfig true }
    defaultConfig { testInstrumentationRunner 'de.jarvis.audio.UiSmokeInstrumentation' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // The scanner's published POM omits its AndroidX implementation dependencies.
    implementation 'androidx.core:core:1.6.0'
    implementation 'androidx.fragment:fragment:1.3.6'
    testImplementation 'junit:junit:4.13.2'
}
