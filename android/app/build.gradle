plugins { id 'com.android.application' }
android {
    namespace 'de.jarvis.audio'
    compileSdk 35
    defaultConfig { applicationId 'de.jarvis.audio'; minSdk 28; targetSdk 34; versionCode 12; versionName '0.9.0' }
    buildFeatures { buildConfig true }
    defaultConfig { testInstrumentationRunner 'de.jarvis.audio.UiSmokeInstrumentation' }
    buildTypes {
        debug {
            applicationIdSuffix '.wakepilot'
            versionNameSuffix '-pilot'
        }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // The scanner's published POM omits its AndroidX implementation dependencies.
    implementation 'androidx.core:core:1.6.0'
    implementation 'androidx.fragment:fragment:1.3.6'
    // Vosk runs entirely on-device after the user explicitly downloads the German model.
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    testImplementation 'junit:junit:4.13.2'
}
