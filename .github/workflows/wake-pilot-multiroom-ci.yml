name: HA Jarvis Echo Relay 0.9.0 Android Update
on:
  push:
    branches: ['feature/native-wakeword-0.7.0']
    paths: ['android/**', '.github/workflows/wake-pilot-multiroom-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Build release, JVM tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build release, unit tests and lint
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --no-daemon --no-problems-report
      - name: Confirm original package ID and version
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$apk"
          pkg="$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep '^package:')"
          echo "$pkg"
          [[ "$pkg" == *"name='de.jarvis.audio'"* ]]
          [[ "$pkg" == *"versionName='0.9.0'"* ]]
      - name: Sign only with original 0.7.1 certificate
        shell: bash
        env:
          HA_JARVIS_ANDROID_KEYSTORE_BASE64: ${{ secrets.HA_JARVIS_ANDROID_KEYSTORE_BASE64 }}
          HA_JARVIS_ANDROID_STORE_PASSWORD: ${{ secrets.HA_JARVIS_ANDROID_STORE_PASSWORD }}
          HA_JARVIS_ANDROID_KEY_ALIAS: ${{ secrets.HA_JARVIS_ANDROID_KEY_ALIAS }}
          HA_JARVIS_ANDROID_KEY_PASSWORD: ${{ secrets.HA_JARVIS_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/dist
          if [[ -z "$HA_JARVIS_ANDROID_KEYSTORE_BASE64" || -z "$HA_JARVIS_ANDROID_STORE_PASSWORD" || -z "$HA_JARVIS_ANDROID_KEY_ALIAS" || -z "$HA_JARVIS_ANDROID_KEY_PASSWORD" ]]; then
            echo "::notice::Original 0.7.1 signing key is not configured. Unsigned candidate only; no installable APK produced."
            exit 0
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$HA_JARVIS_ANDROID_KEYSTORE_BASE64" | base64 -d > "$tmp/original.jks"
          tools="$ANDROID_HOME/build-tools/34.0.0"
          old="android/downloads/HA-Jarvis-Echo-Relay-0.7.1.apk"
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          target="android/dist/HA-Jarvis-Echo-Relay-0.9.0.apk"
          test -f "$old"
          "$tools/zipalign" -f -p 4 "$unsigned" "$tmp/aligned.apk"
          "$tools/apksigner" sign --ks "$tmp/original.jks" --ks-key-alias "$HA_JARVIS_ANDROID_KEY_ALIAS" \
             --ks-pass env:HA_JARVIS_ANDROID_STORE_PASSWORD --key-pass env:HA_JARVIS_ANDROID_KEY_PASSWORD \
             --out "$target" "$tmp/aligned.apk"
          "$tools/apksigner" verify --verbose "$target"
          old_cert="$("$tools/apksigner" verify --print-certs "$old" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '\r')"
          new_cert="$("$tools/apksigner" verify --print-certs "$target" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '\r')"
          if [[ -z "$old_cert" || "$old_cert" != "$new_cert" ]]; then
            rm -f "$target"
            echo "::error::Wrong signing certificate. Refusing incompatible Android update."
            exit 1
          fi
          (cd android/dist && sha256sum HA-Jarvis-Echo-Relay-0.9.0.apk > SHA256SUMS)
          echo "::notice::Verified same signing certificate as 0.7.1; direct update supported."
      - name: Upload compatible signed APK
        if: ${{ hashFiles('android/dist/HA-Jarvis-Echo-Relay-0.9.0.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: HA-Jarvis-Echo-Relay-0.9.0-signed
          path: |
            android/dist/HA-Jarvis-Echo-Relay-0.9.0.apk
            android/dist/SHA256SUMS
      - name: Upload unsigned candidate for existing private signer
        uses: actions/upload-artifact@v4
        with:
          name: HA-Jarvis-Echo-Relay-0.9.0-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
