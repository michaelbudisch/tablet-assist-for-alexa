name: Android audio app
on:
  push:
    branches: [main]
    paths: ['android/**', 'homeassistant/custom_components/jarvis_tablet_audio/**', 'tests/relay_camera_e2e/**', '.github/workflows/android-audio.yml']
  pull_request:
    paths: ['android/**', 'homeassistant/custom_components/jarvis_tablet_audio/**', 'tests/relay_camera_e2e/**', '.github/workflows/android-audio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build, JVM tests, lint and UI-test compilation
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --no-daemon --no-problems-report
      - name: Compile non-debuggable release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --no-problems-report
      - uses: actions/upload-artifact@v4
        with:
          name: HA-Jarvis-Echo-Relay-0.6.0-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Verify published APK checksum
        working-directory: android/downloads
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: HA-Jarvis-Echo-Relay-ci-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  camera-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test authenticated camera and vision routing in real HA
        run: bash tests/relay_camera_e2e/run.sh
  preview:
    needs: [checks, camera-receiver]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish checked preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="audio-v$(tr -d '\r\n' < android/VERSION)"
          version="$(tr -d '\r\n' < android/VERSION)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Preview already exists; keep existing release unchanged.'
            exit 0
          fi
          if [[ ! -f "android/downloads/HA-Jarvis-Echo-Relay-$version-preview.apk" ]]; then
            echo 'No signed release APK checked in; no automatic publication.'
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title "HA Jarvis Echo Relay $(cat android/VERSION) · Preview" \
            --notes-file android/RELEASE_NOTES.md \
            "android/downloads/HA-Jarvis-Echo-Relay-$version-preview.apk" android/downloads/SHA256SUMS \
            android/licenses/APACHE-2.0.txt android/THIRD_PARTY_NOTICES.md
