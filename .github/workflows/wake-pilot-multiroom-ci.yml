name: Wake Pilot Multiroom Android CI
on:
  push:
    branches: ['feature/native-wakeword-0.7.0']
    paths: ['android/**', '.github/workflows/wake-pilot-multiroom-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Wake Pilot 0.9.0 build and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build debug APK, unit tests and lint
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --no-daemon --no-problems-report
      - name: Upload Wake Pilot 0.9.0
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Wake-Pilot-0.9.0-dynamic-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
