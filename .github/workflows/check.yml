name: Source, audio and staging checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    # Match the pinned Playwright version's supported browser dependencies.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate local speech server and Proxmox upgrade scripts
        run: |
          bash -n proxmox/*.sh worker/scripts/linux/setup-linux.sh
          python -m py_compile speechserver/api.py speechserver/piper_service.py proxmox/tafa-export-json.py
          python -m unittest discover -s proxmox -p 'test_tafa_export_json.py' -v
      - run: python tests/check_sources.py
      - name: Validate public TAFA documentation and links
        run: python tests/test_docs_public.py
      - run: python tests/test_audio.py
      - run: python -m unittest discover -s tafa_app/tests -p 'test_installer.py' -v
      - run: python tests/test_marketplace.py
      - run: python tests/test_proxy.py
      - run: python tests/test_combined_proxmox.py
      - run: python tests/test_proxy_host.py
      - run: python tests/test_standalone.py
      - run: python tests/test_local_intents.py
      - run: node tests/test_ambient_rebind.mjs
      - run: python -m unittest discover -s tafa_app/tests -p 'test_camera_migration_contract.py' -v
      - run: python -m unittest discover -s tafa_app/tests -p 'test_control_center_layout.py' -v
