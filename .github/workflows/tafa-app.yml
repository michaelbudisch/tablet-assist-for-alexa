name: TAFA App and unified backend CI
on:
  push:
    paths:
      - 'tafa_app/**'
      - 'custom_components/tablet_assist_for_alexa/**'
      - 'scripts/test_unified_layout.py'
      - '.github/workflows/tafa-app.yml'
  pull_request:
    paths:
      - 'tafa_app/**'
      - 'custom_components/tablet_assist_for_alexa/**'
      - 'scripts/test_unified_layout.py'
      - '.github/workflows/tafa-app.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q tafa_app custom_components/tablet_assist_for_alexa
      - name: Unified backend release guard
        run: python scripts/test_unified_layout.py
      - name: Safe installer and CPU API tests
        run: python -m unittest discover -s tafa_app/tests -v
  build:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Build HA App container
        run: docker build --pull --progress=plain -f tafa_app/Dockerfile tafa_app
